name = "clubping-fr"
pages_build_output_dir = "./dist"
compatibility_date = "2025-01-01"

# Production. Cloudflare Pages applies the top-level config to the production
# deployment (the `main` branch); every other branch gets [env.preview] below.
[[d1_databases]]
binding = "DB"
database_name = "clubping-fr-prod"
database_id = "e9978079-2659-4fc1-a7ba-a189180029ec"

# Preview — every PR/branch deployment (#296).
#
# Previews used to share the production database and never ran migrations, so
# a schema-changing PR could not be tested on its own preview (#293 returned
# 500 on every query touching a column its migration adds), and merely trying
# a preview wrote to real data.
#
# clubping-fr-dev is an ANONYMISED copy of production, migrated by preview.yml
# before each preview deploy. Refresh it deliberately with
# `npm run db:refresh:dev`, which scrubs names, emails, phones and licence
# numbers and purges sessions/OTPs on the way in (#313) — previews enable dev
# login, so anything left here is reachable by anyone who guesses the URL.
[[env.preview.d1_databases]]
binding = "DB"
database_name = "clubping-fr-dev"
database_id = "033f804f-e2d5-48e3-a5f5-8e3b34dd2411"

# Auth config (see docs/AUTH_SETUP.md).
# This project manages plain vars through wrangler.toml (the Cloudflare dashboard
# only accepts Secrets), so non-secret auth values live in [vars] below.
# The one real secret, RESEND_API_KEY, is set as a Pages Secret in the dashboard
# (or `wrangler pages secret put RESEND_API_KEY`) — never committed.
# Locally, all of these come from `.dev.vars` (see .dev.vars.example).
[vars]
RESEND_FROM = "Club Ping <no-reply@mail.leskno.fr>"
# Comma-separated accepted OIDC audiences — fill in once OAuth clients exist (#100):
#   GOOGLE_CLIENT_IDS = "web-id,ios-id,android-id"
#   APPLE_CLIENT_IDS  = "fr.clubping.web,fr.clubping.app"

# Named environments do NOT inherit `vars` (nor `d1_databases`): anything the
# preview needs has to be repeated here, or a preview deployment silently loses
# it. Keep this block in step with [vars] above.
#
# Secrets are separate: RESEND_API_KEY is a Pages Secret and has to exist for
# the preview environment too — set it in the dashboard, or with
# `wrangler pages secret put RESEND_API_KEY --env preview`.
[env.preview.vars]
RESEND_FROM = "Club Ping <no-reply@mail.leskno.fr>"
# Every e-mail the preview sends lands here instead of its real recipient,
# carrying the intended address in an X-Original-Recipient header and at the top
# of the body (#474). The onboarding flow writes to *clubs* — addresses read off
# the FFTT listing — so a preview that could reach them is a preview that can
# mail a real club by accident. NEVER add this to the top-level [vars]: in
# production it would silently swallow every message, sign-in codes included.
# src/test/workflows.spec.ts fails the build if it appears there.
EMAIL_REDIRECT_TO = "clubping.dev@leskno.fr"
# Enables /api/auth/dev/* — sign in as any user with no credential (#313).
# NEVER add this to the top-level [vars]: on production it is a complete
# authentication bypass. It is defensible here only because clubping-fr-dev is
# anonymised on refresh. src/test/workflows.spec.ts fails the build if it
# appears in the production block.
DEV_LOGIN_ENABLED = "true"
