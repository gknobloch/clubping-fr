# Signs into the review account and waits for the tab bar (#520).
#
# A subflow rather than the top of capture.yaml: it is the one part of the
# capture that touches a real credential, so it is the one file worth being
# able to read on its own. ${EMAIL} and ${CODE} are passed with `maestro test
# -e EMAIL=… -e CODE=…` — never written here, and never the OTP an ordinary
# member gets by mail. auth.ts accepts REVIEW_LOGIN_CODE in place of the
# emailed code for exactly this one address (App Store / Play review), which is
# what lets this run with no inbox to read from.
#
# `id:` selects by testID — mobile/app/login.tsx carries one on each of these
# four elements for this flow alone; nothing else in the app reads them.
appId: fr.clubping.app
---
# `clearState` empties the app's data container — and on iOS the session token
# is not in it. expo-secure-store keeps it in the Keychain, which survives a
# state clear and an app reinstall both, so the app restored its session and
# swapped the login screen away mid-flow: the email field was found and typed
# into, and the button underneath it had already stopped existing.
#
# Android needs none of this: expo-secure-store is backed by SharedPreferences
# there, which `clearState` does empty. Hence the platform guard rather than a
# bare command that would fail on the emulator.
- runFlow:
    when:
      platform: iOS
    commands:
      - clearKeychain
# `permissions` decides the notification prompt before it can be asked, and
# DENY rather than allow: this device must never hold a push token. The review
# account is a captain with a match six days out, so the nightly dispatch
# (#495) would happily land a real banner across a store screenshot.
- launchApp:
    clearState: true
    permissions:
      notifications: deny
- tapOn:
    id: "login-email-input"
- inputText: ${EMAIL}
# Android's soft keyboard covers the whole login card — the field AND the
# button under it — and the button is then not in the hierarchy at all, so
# `tapOn` fails rather than merely missing. iOS keeps the card above its
# keyboard, which is why this only appeared the first time the flow ran on an
# emulator.
#
# Guarded rather than unconditional: the iOS path is proven as it stands, and
# `hideKeyboard` there would be a change to a run that works. Lift the guard if
# iOS ever needs it too.
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn:
    id: "login-request-code-button"
# The review account's code never goes to an inbox, so there is no delay to
# wait out — but the screen transition (email step → code step) still needs a
# moment, and `tapOn` already retries until its target exists.
- tapOn:
    id: "login-code-input"
- inputText: ${CODE}
- runFlow:
    when:
      platform: Android
    commands:
      - hideKeyboard
- tapOn:
    id: "login-verify-button"

# The notification prompt, dismissed BEFORE the tab bar is waited for.
#
# `<Push>` mounts the instant a session exists (utils/push.ts), so the OS asks
# right here — and while it is up it owns the accessibility hierarchy: the tab
# bar is drawn underneath and simply not visible to a query. Waiting first and
# dismissing after, which is where this used to sit, therefore times out on a
# screen that is perfectly fine.
#
# Denied, not allowed: this device must never hold a push token. The review
# account is a captain with a match six days out, so the nightly dispatch
# (#495) would land a real banner across a screenshot. `permissions:` on
# launchApp asks for the same thing and does not get it on Android, where
# POST_NOTIFICATIONS is a runtime permission the app requests for itself.
#
# Optional, and both spellings: a device where an earlier run already settled
# the prompt shows nothing, and that is the common case rather than a failure.
- tapOn:
    text: "Don.t allow|Don.t Allow|Ne pas autoriser|Refuser"
    optional: true
# The tab bar is the one thing every landing state shares — a session token
# saved from a previous run, DEV_LOGIN off, and this member's own club/team all
# lead here, but a wrong email or a rejected code does not.
# extendedWaitUntil, not assertVisible: only this one takes a timeout, and the
# wait is the point — the verify round trip trades a code for a session over
# the network before any tab exists.
- extendedWaitUntil:
    visible:
      id: "tab-bar"
    timeout: 15000

# A prompt left un-answered by an earlier run survives `clearState` and
# `clearKeychain` both — it is SpringBoard's, not the app's — and it comes back
# over the next launch, where it owns the accessibility hierarchy and hides
# every element underneath it. That is what a stuck iPad run looks like.
#
# It has to be settled HERE, before capture.yaml turns the device sideways: a
# system alert cannot be tapped once `setOrientation` has been used. The
# hierarchy keeps reporting the portrait frame while the screen draws rotated,
# and SpringBoard's own alert stops receiving the taps Maestro aims at it —
# verified: the identical `tapOn` that does nothing in landscape dismisses the
# alert in portrait. In-app elements are unaffected.
#
# `Don.t Allow` because iOS writes a typographic apostrophe (Don’t), and a
# straight one in the pattern matches nothing at all.
# Again, for a prompt that arrived late — after the tab bar rather than before
# it. Costs nothing when there is nothing to tap.
- tapOn:
    text: "Don.t allow|Don.t Allow|Ne pas autoriser|Refuser"
    optional: true
