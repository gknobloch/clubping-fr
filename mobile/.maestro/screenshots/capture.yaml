# The store screenshots, one platform-agnostic flow (#520).
#
# One flow because the app has one bundle id on both platforms
# (`fr.clubping.app` — see fastlane/Appfile) and the same screens: only the
# connected device decides whether Maestro drives the simulator or the
# emulator. scripts/store-screenshots.mjs runs this once per target and moves
# each PNG to wherever `deliver` (iOS) or `supply` (Android) expects it — this
# file only ever writes 01..07 into its own debug output.
#
# Everything is selected by `testID`. This app exposes almost no text to the
# accessibility tree: dumping the hierarchy on the Accueil screen returns no
# member name, no fixture, no availability buttons — only ids. A selector
# written against a visible label does not match, however it is spelled.
#
# The set walks one thread rather than touring the tabs: a captain opens the
# app, sees the coming match, checks the calendar, goes to his team, looks a
# player up, opens her profile, and ends on the club's roster. Screens 5 and 6
# are Camille Durand, who has played twice and is therefore burned into team 1
# — a rule this app explains and its competitors do not.
appId: fr.clubping.app
---
- runFlow: login.yaml

# 1 — the first thing anybody sees: the coming match, who has answered, and
# the line-up already made.
- takeScreenshot: 01-accueil

# 2 — the calendar. A phone shows the journées as a list; a tablet shows the
# availability matrix instead (journees/index.tsx branches on `isTablet`), so
# this one screenshot is deliberately a different screen per device. That is
# the honest picture: they ARE different screens.
- tapOn:
    id: "tab-journees"
- takeScreenshot: 02-journees

# 3 and 4 — the club's teams, then one of them in full.
- tapOn:
    id: "tab-equipes"
- takeScreenshot: 03-equipes
- tapOn:
    id: "team-row-demo-team-1"
- takeScreenshot: 04-equipe

# 5 and 6 — a player, twice over: the quick view that opens from a squad row,
# then the full profile behind it. Camille Durand by name, because she is the
# one carrying the brûlage badge.
- tapOn:
    id: "squad-player-demo-player-2"
- takeScreenshot: 05-joueur-apercu
- tapOn:
    id: "player-sheet-profile"
- takeScreenshot: 06-joueur-profil

# 7 — the club's roster, which is also the way back out of the detail stack.
- tapOn:
    id: "tab-joueurs"
- takeScreenshot: 07-joueurs
