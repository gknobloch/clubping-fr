<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <!--
    App icon: the Club Ping brand mark ("face à face") on the slate tile, so the
    icon, the web favicon and the AppShell header all show the same drawing.
    The dark blade flips to near-white here because the tile itself is slate.

    Geometry mirrors public/logo.svg on a 64-unit grid, scaled x16 to 1024.
    Splash keeps the welcome photo — see splash-icon.svg.
  -->
  <defs>
    <clipPath id="cp-blade">
      <circle cx="384" cy="400" r="224"/>
    </clipPath>
  </defs>
  <rect width="1024" height="1024" fill="#1e293b"/>
  <!-- The mark's own bounds are 116..908 x 176..826 on this grid, so its centre
       is (512, 501.2), not (512, 512). Recentre, then bump to ~82% of the tile
       width — enough presence without pushing the handle tips into the corners
       iOS rounds off. -->
  <g transform="translate(512 512) scale(1.06) translate(-512 -501.2)">
    <g stroke-width="104" stroke-linecap="round">
      <line x1="320" y1="510.4" x2="168" y2="774.4" stroke="#eef2f7"/>
      <line x1="704" y1="510.4" x2="856" y2="774.4" stroke="#e23b3b"/>
    </g>
    <circle cx="384" cy="400" r="224" fill="#eef2f7"/>
    <circle cx="640" cy="400" r="224" fill="#e23b3b"/>
    <circle cx="640" cy="400" r="224" fill="#a63232" clip-path="url(#cp-blade)"/>
    <circle cx="512" cy="400" r="80" fill="#ffffff"/>
  </g>
</svg>
