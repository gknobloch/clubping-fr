<svg width="1024" height="500" viewBox="0 0 1024 500" xmlns="http://www.w3.org/2000/svg">
  <!--
    Google Play feature graphic (#356). Play requires exactly 1024x500, fully
    opaque, and crops or overlays it in several surfaces — so everything that
    matters stays inside the middle band, well clear of the edges.

    Same "face à face" mark as icon.svg, on the same slate tile, so the store
    listing, the app icon and the AppShell header all show one drawing.
  -->
  <defs>
    <!-- Outfit is the brand display face (see tailwind.config.js). render.mjs
         waits for networkidle, so the webfont is in place before the capture;
         if it ever isn't, system-ui keeps the layout intact. -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@500;600&amp;family=DM+Sans:opsz,wght@9..40,400&amp;display=swap');
    </style>
    <clipPath id="cp-blade">
      <circle cx="384" cy="400" r="224"/>
    </clipPath>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#23324a"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <!-- Must fade to nothing: a flat circle at low opacity still reads as a
         disc behind the mark rather than as light. -->
    <radialGradient id="wash">
      <stop offset="0" stop-color="#e23b3b" stop-opacity="0.16"/>
      <stop offset="0.55" stop-color="#e23b3b" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#e23b3b" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1024" height="500" fill="url(#tile)"/>

  <!-- Accent wash behind the mark, echoing the login screen's glow. -->
  <circle cx="268" cy="250" r="240" fill="url(#wash)"/>

  <!-- icon.svg draws on a 1024 grid with the mark's true centre at (512, 501.2);
       recentre it there, scale to ~300px tall, then place it left of the text. -->
  <g transform="translate(268 250) scale(0.44) translate(-512 -501.2)">
    <g stroke-width="104" stroke-linecap="round">
      <line x1="320" y1="510.4" x2="168" y2="774.4" stroke="#eef2f7"/>
      <line x1="704" y1="510.4" x2="856" y2="774.4" stroke="#e23b3b"/>
    </g>
    <circle cx="384" cy="400" r="224" fill="#eef2f7"/>
    <circle cx="640" cy="400" r="224" fill="#e23b3b"/>
    <circle cx="640" cy="400" r="224" fill="#a63232" clip-path="url(#cp-blade)"/>
    <circle cx="512" cy="400" r="80" fill="#ffffff"/>
  </g>

  <g fill="#f8fafc" font-family="Outfit, system-ui, sans-serif">
    <text x="470" y="248" font-size="96" font-weight="600" letter-spacing="-2">Club Ping</text>
  </g>
  <g fill="#cbd5e1" font-family="'DM Sans', system-ui, sans-serif">
    <!-- Two lines rather than one: a single 500px-wide line would have to drop
         to ~26px to fit, which Play's smaller placements render to mush. -->
    <text x="472" y="304" font-size="34">Le tennis de table de club</text>
    <text x="472" y="348" font-size="34">au quotidien.</text>
  </g>
  <rect x="472" y="378" width="86" height="5" rx="2.5" fill="#e23b3b"/>
</svg>
