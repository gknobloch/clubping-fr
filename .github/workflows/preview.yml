name: Preview Deploy

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

jobs:
  cleanup:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Delete preview deployments
        # Sends NO page/per_page (#321). An earlier attempt added
        # `per_page=100`, which this endpoint rejects outright — 8000024,
        # "Invalid list options provided" — leaving the job dead on arrival and
        # nothing deleted at all. Cloudflare's own SDK types this listing as a
        # SinglePage, "a response that isn't actually paginated at the API
        # level", and `wrangler pages deployment list` sends no paging
        # parameters either. So: don't page, and prove the outcome instead —
        # the re-check below fails loudly if anything was left behind.
        run: |
          set -euo pipefail
          BRANCH="pr-${{ github.event.pull_request.number }}"
          PROJECT="clubping-fr"
          API="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/deployments"
          AUTH="Authorization: Bearer $CLOUDFLARE_API_TOKEN"

          # Every deployment id on $BRANCH. A failed request aborts rather than
          # returning nothing — an empty list here reads exactly like "nothing
          # left to delete", which is how the original job reported success
          # while doing no work.
          list_branch_deployments() {
            local body
            body=$(curl -sS --retry 3 --retry-delay 2 -H "$AUTH" "$API")
            if [ "$(jq -r '.success' <<<"$body")" != "true" ]; then
              # stderr, not stdout: this function's stdout is captured by the
              # caller, so a message on it would vanish into the variable.
              echo "::error::deployments list failed: $(jq -c '.errors' <<<"$body")" >&2
              return 1
            fi
            jq -r --arg b "$BRANCH" \
              '.result[] | select(.deployment_trigger.metadata.branch == $b) | .id' <<<"$body"
          }

          ids=$(list_branch_deployments)
          if [ -z "$ids" ]; then
            echo "No deployments found for $BRANCH."
          else
            echo "Deleting $(echo "$ids" | wc -l) deployment(s) for $BRANCH"
            for id in $ids; do
              response=$(curl -sS --retry 3 --retry-delay 2 -X DELETE -H "$AUTH" "$API/$id?force=true")
              if [ "$(jq -r '.success' <<<"$response")" != "true" ]; then
                echo "::error::failed to delete $id: $(jq -c '.errors' <<<"$response")"
                exit 1
              fi
              echo "Deleted $id"
            done
          fi

          # Prove it, rather than assuming: a success here used to mean only
          # that curl ran.
          remaining=$(list_branch_deployments)
          if [ -n "$remaining" ]; then
            echo "::error::deployments still present for $BRANCH after cleanup:"
            echo "$remaining"
            exit 1
          fi
          echo "No deployments remain for $BRANCH."

          # Informational, and the open question (#321). On #316 all three of
          # its deployments were deleted and pr-316.clubping-fr.pages.dev kept
          # serving anyway — so deleting deployments does not, on its own,
          # retire the branch alias. Whether that is permanent or just
          # propagation lag is unknown; this line is how we find out, one PR
          # close at a time. Not a failure: the count above is what this job
          # controls.
          code=$(curl -sS -o /dev/null -w '%{http_code}' "https://$BRANCH.$PROJECT.pages.dev" || echo "000")
          echo "Alias https://$BRANCH.$PROJECT.pages.dev -> HTTP $code (200 = still served)"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLUBPING_FR_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLUBPING_FR_CLOUDFLARE_ACCOUNT_ID }}

  preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
        env:
          npm_config_registry: 'https://registry.npmjs.org/'
      - name: Run D1 migrations (preview database)
        # Previews run against clubping-fr-dev, never production (#296), and
        # migrate it first — so a schema-changing PR is actually exercisable on
        # its preview, and the production deploy is no longer the first real
        # execution of a migration.
        #
        # Same native migration system as deploy.yml (#312), so a broken
        # migration now fails HERE, on the PR, rather than sailing through to
        # the production deploy. --env preview because clubping-fr-dev is
        # declared under [env.preview.d1_databases] in wrangler.toml.
        run: npx wrangler d1 migrations apply clubping-fr-dev --remote --env preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLUBPING_FR_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLUBPING_FR_CLOUDFLARE_ACCOUNT_ID }}
      - name: Build with PR metadata
        run: npm run build
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ github.sha }}
          # Previews are a production build, so import.meta.env.DEV is false and
          # the dev login disappears — testing a PR meant waiting for a real
          # Resend code (#313). This restores it for previews ONLY.
          #
          # Safe only because clubping-fr-dev is anonymised on refresh
          # (scripts/anonymise-dev-db.sql): preview URLs are guessable and
          # publicly reachable, so "sign in as anyone" there would otherwise
          # hand out real member data.
          #
          # Never add this to deploy.yml — it would ship an authentication
          # bypass against real data. src/test/workflows.spec.ts fails the
          # build if it ever appears there.
          VITE_DEV_LOGIN: 'true'
      - name: Deploy preview to Cloudflare Pages
        id: deploy
        run: |
          DEPLOY_OUTPUT=$(npx wrangler pages deploy --project-name=clubping-fr --branch="pr-${{ github.event.pull_request.number }}" 2>&1)
          echo "$DEPLOY_OUTPUT"
          PREVIEW_URL=$(echo "$DEPLOY_OUTPUT" | grep -oE 'https://[^ ]+\.pages\.dev' | tail -1)
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLUBPING_FR_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLUBPING_FR_CLOUDFLARE_ACCOUNT_ID }}
      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = '${{ steps.deploy.outputs.preview_url }}';
            const sha = '${{ github.sha }}'.slice(0, 7);
            const body = `🔍 **Preview deployed**\n\n` +
              `📎 ${previewUrl}\n` +
              `📦 Commit: \`${sha}\`\n\n` +
              `_Updated on each push to this PR._`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Preview deployed')
            );
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
