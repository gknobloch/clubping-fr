name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
        env:
          npm_config_registry: 'https://registry.npmjs.org/'
      - run: npm run build
      - run: npm run lint

  # mobile/ has its own tsconfig and its own node_modules, so `npm run build`
  # above never looks at it — which is how a type error introduced by #282 in
  # the SHARED src/types survived there until #319 found it by hand.
  #
  # That sharing is the whole point of this job: mobile/tsconfig.json maps
  # @shared/types to ../src/types/index.ts, so a web-side change to a shared
  # type can break the app without touching a single file under mobile/.
  mobile-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json
      # No root `npm ci`: the shared files mobile pulls in import nothing but
      # each other, so mobile's own dependencies are enough.
      #
      # No --legacy-peer-deps either: the lockfile satisfies npm's peer rules
      # since #326 pinned react-dom to react's own version, as expo 55 expects.
      # Keep it that way — the flag would hide the next such drift rather than
      # report it.
      - run: npm ci
        working-directory: mobile
        env:
          npm_config_registry: 'https://registry.npmjs.org/'
      # #402 — the SDK 55 packages, react-native and typescript had drifted
      # behind the versions the installed expo expects, and nothing failed
      # until someone ran the app by hand. `npm ci` above fails on a lockfile
      # out of sync with package.json; this catches the other half — a
      # package.json out of sync with expo's expected versions.
      - run: npx expo install --check
        working-directory: mobile
      - run: npm run typecheck
        working-directory: mobile

  # #148 — the mobile app shipped #141/#143/#146/#147 with no test runner at
  # all, against the project rule that new features carry unit tests. jest-expo
  # is the harness; this is where it runs.
  #
  # Kept apart from mobile-typecheck for the same reason `unit` is kept apart
  # from `build` on the web side: a red job should say which of the two broke.
  # It is also a different kind of check — the typecheck would have caught the
  # #282 type error but executes nothing, which is exactly why the offline cache
  # went untested.
  mobile-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json
      # Same as above: mobile's own dependencies are enough, and no
      # --legacy-peer-deps (#326).
      - run: npm ci
        working-directory: mobile
        env:
          npm_config_registry: 'https://registry.npmjs.org/'
      - run: npm run test:run
        working-directory: mobile

  # #312 — provisioning a database from scratch was quietly broken: 0001 had
  # been edited to create the is_archived columns that 0002-0005 also add, so
  # those four failed on any empty database. The `|| true` loop hid it, and
  # nothing else ever built a database from nothing.
  #
  # This applies the whole history to an empty local D1, with the very command
  # the deploy now uses. It needs no Cloudflare credentials — --local never
  # leaves the runner.
  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
        env:
          npm_config_registry: 'https://registry.npmjs.org/'
      - name: Apply every migration to an empty database
        run: npx wrangler d1 migrations apply clubping-fr-prod --local --persist-to "$RUNNER_TEMP/d1"

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
        env:
          npm_config_registry: 'https://registry.npmjs.org/'
      - run: npm run test:run

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
        env:
          npm_config_registry: 'https://registry.npmjs.org/'
      # #494 — `--with-deps` starts with an `apt-get update`, which reads every
      # source configured on the image, and ubuntu-latest carries Google's
      # Chrome repo. On 9 September a hash sum mismatch there held #493 for a
      # day: three reruns died in ~25 s, before a single test ran. That source
      # brings this job nothing — Playwright downloads its own Chromium, and the
      # libraries `--with-deps` really installs come from Ubuntu's repos.
      #
      # `--with-deps` is kept: it is what makes a missing system dependency show
      # up here rather than on someone's laptop.
      #
      # The glob matters. The image already deleted `google-chrome.list`, but
      # Chrome's deb had moved to the deb822 layout and wrote
      # `google-chrome.sources`, which slipped through — so the name alone
      # would be a no-op. Fixed upstream in runner-images#14711 on 10 September,
      # after the image ubuntu-latest still serves; these two lines stay
      # afterwards, since `rm -f` on nothing costs nothing and the file has come
      # back once already.
      - run: sudo rm -f /etc/apt/sources.list.d/google-chrome*
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          CI: true
