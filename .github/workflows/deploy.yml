name: Deploy

on:
  push:
    branches: [main]

# Deploys must never run concurrently: two back-to-back merges once raced and
# the older build finished last, shipping stale code to production. Queue them
# instead (never cancel a running deploy mid-flight; the newest queued run
# supersedes older queued ones).
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
        env:
          npm_config_registry: 'https://registry.npmjs.org/'
      - name: Run D1 migrations
        # Wrangler's own migration system (#312): it records what it has run in
        # d1_migrations, applies each file exactly once, and FAILS on a real
        # error instead of shrugging.
        #
        # What this replaces was a loop over the directory ending in `|| true`,
        # needed because re-applying a non-idempotent ALTER TABLE fails by
        # design. The cost was that a genuine failure looked exactly like an
        # expected one — swallowed, job green, deploy shipped against a broken
        # schema. That is how #293 reached production.
        #
        # It also replayed all 37 files on every deploy: 1m31s of the 2m33s
        # deploy, growing by one round trip per migration added. A normal deploy
        # now applies nothing and says so.
        run: npx wrangler d1 migrations apply clubping-fr-prod --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLUBPING_FR_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLUBPING_FR_CLOUDFLARE_ACCOUNT_ID }}
      - run: npm run build
      - run: npx wrangler pages deploy --project-name=clubping-fr
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLUBPING_FR_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLUBPING_FR_CLOUDFLARE_ACCOUNT_ID }}
